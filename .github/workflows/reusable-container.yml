name: reusable-container
on:
  workflow_call:
    inputs:
      image: {type: string, required: true}       # ghcr.io/cholpans/<name>
      context: {type: string, default: "."}
      dockerfile: {type: string, default: "Dockerfile"}
permissions: {contents: read, packages: write, id-token: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: {registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }}}
      - uses: docker/build-push-action@v6
        id: build
        with: {context: ${{ inputs.context }}, file: ${{ inputs.dockerfile }}, push: true, tags: "${{ inputs.image }}:${{ github.sha }}", provenance: true, sbom: true}
      - uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes "${{ inputs.image }}@${{ steps.build.outputs.digest }}"
      - uses: aquasecurity/trivy-action@0.28.0
        with: {image-ref: "${{ inputs.image }}@${{ steps.build.outputs.digest }}", severity: "CRITICAL,HIGH", exit-code: "1"}
