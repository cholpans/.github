name: reusable-ci-python
on:
  workflow_call:
    inputs:
      python-version: {type: string, default: "3.12"}
      working-directory: {type: string, default: "."}
permissions: {contents: read}
jobs:
  ci:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: "${{ inputs.working-directory }}"}}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: {enable-cache: true}
      - run: uv python install ${{ inputs.python-version }}
      - run: uv sync --all-extras --dev
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pytest -q --cov --cov-report=xml
      - run: uv run pip-audit || true
