name: reusable-ci-go
on:
  workflow_call:
    inputs:
      go-version: {type: string, default: "1.23"}
      working-directory: {type: string, default: "."}
permissions: {contents: read}
jobs:
  ci:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ${{ inputs.working-directory }}}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version: ${{ inputs.go-version }}, cache: true}
      - uses: golangci/golangci-lint-action@v6
        with: {version: latest, working-directory: ${{ inputs.working-directory }}}
      - run: go vet ./... && go test -race -cover ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
